[project]
name = "gpu-compare"
version = "0.1.0"
description = "Compare local model inference on rented GPUs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.37,<2",
  "mangum>=0.19,<1",
  "httpx>=0.28,<1",
  "vastai==1.11.0",
]

[dependency-groups]
dev = ["boto3[crt]>=1.37,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "moto[server]>=5,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gpu_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and the local AWS emulator", "live: requires real GPU hardware"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
